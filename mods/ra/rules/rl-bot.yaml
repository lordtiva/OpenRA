Player:
	ExternalBotBridge@RLAGENT:
		Name: bot-rl-agent.name
		Type: rl-agent
		Port: 9999
		ObservationInterval: 9999
	ModularBot@DummyAI:
		Name: Dummy (Passive)
		Type: dummy
	# v3 commander: the rl-agent runs the normal AI's bot modules (ai.yaml, || enable-rl-agent);
	# its strategic choices go through ExternalBotBridge (IBotDecisionBroker).
	GrantConditionOnBotOwner@rl-agent:
		Condition: enable-rl-agent
		Bots: rl-agent
